<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwapFee — Best Crypto Swap Rates</title>
  <meta name="description" content="Swap crypto instantly with SwapFee. Compare crypto swap rates with no registration.">

  <style>
    :root {
      --bg: #020408;
      --cyan: #4facfe;
      --cyan-bright: #00eaff;
      --text: #f5f9ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    /* 3D Background Canvas */
    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Header styling with New Button */
    header {
      position: relative;
      z-index: 10;
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .brand-mark {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(79,172,254,0.28), rgba(0,234,255,0.04));
      border: 1px solid rgba(111,211,255,0.3);
      display: grid; place-items: center;
    }
    .brand-mark::before {
      content: "";
      width: 16px; height: 16px;
      border: 2px solid var(--cyan-bright);
      border-radius: 50%;
    }
    .brand-name { font-size: 18px; font-weight: 800; letter-spacing: 0.18em; }
    .brand-name span { color: var(--cyan-bright); }

    /* The New SEO News Button */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .news-btn {
      padding: 10px 20px;
      border-radius: 99px;
      background: rgba(0, 234, 255, 0.1);
      border: 1px solid var(--cyan-bright);
      color: var(--cyan-bright);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .news-btn:hover {
      background: var(--cyan-bright);
      color: #000;
      box-shadow: 0 0 20px rgba(0, 234, 255, 0.5);
    }

    /* Main Content */
    .content {
      position: relative;
      z-index: 5;
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(40px, 8vh, 90px) 0 70px;
      text-align: center;
    }

    h1 {
      font-size: clamp(58px, 10vw, 108px);
      font-weight: 900;
      margin-bottom: 18px;
      color: #fff;
    }
    .gradient-word {
      background: linear-gradient(105deg, #fff, #4facfe, #00eaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      max-width: 620px; margin-bottom: 34px; color: #7f8da0;
      font-size: clamp(14px, 2vw, 17px); line-height: 1.7;
    }

    /* Widget Wrap */
    .widget-wrap {
      position: relative;
      width: min(820px, 100%);
      padding: 12px;
      border-radius: 26px;
      background: rgba(10, 16, 26, 0.85);
      border: 1px solid rgba(104, 210, 255, 0.35);
      box-shadow: 0 35px 100px rgba(0,0,0,0.7), 0 0 90px rgba(0,166,255,0.09);
      backdrop-filter: blur(22px);
    }
    iframe {
      border: none; border-radius: 16px;
      width: 100%; height: 340px; display: block;
      background: #080d14;
    }

    /* Features */
    .features {
      width: min(820px, 100%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px; margin-top: 18px;
    }
    .feature {
      padding: 14px; display: flex; flex-direction: column; align-items: center;
      border-radius: 15px; border: 1px solid rgba(90, 150, 190, 0.1);
      background: rgba(8, 14, 22, 0.5); backdrop-filter: blur(12px);
    }
    .feature-value { color: #dceaf5; font-size: 12px; font-weight: 700; }
    .feature-label { color: #58687b; font-size: 9px; margin-top: 5px; text-transform: uppercase; }

    footer { position: relative; z-index: 5; text-align: center; padding: 30px; color: #536274; font-size: 11px; }

    @media (max-width: 720px) {
      .features { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- 3D Canvas Background -->
  <canvas id="bg-canvas"></canvas>

  <header>
    <a class="brand" href="/">
      <div class="brand-mark"></div>
      <div class="brand-name">SWAP<span>FEE</span></div>
    </a>
    <div class="nav-links">
      <a href="news.html" class="news-btn">Crypto News 📰</a>
    </div>
  </header>

  <main class="content">
    <section class="hero">
      <h1><span class="gradient-word">SWAP</span>FEE</h1>
      <p class="subtitle">Swap crypto instantly — <strong>compare rates</strong> and execute your exchange without registration.</p>

      <div class="widget-wrap">
        <iframe id="stealthex-widget" src="https://stealthex.io/widget/f70f0188-5e17-4617-8d56-1323ce5cd134" allow="clipboard-read; clipboard-write"></iframe>
      </div>

      <div class="features">
        <div class="feature"><div class="feature-value">No Account</div><div class="feature-label">Registration</div></div>
        <div class="feature"><div class="feature-value">Competitive</div><div class="feature-label">Swap Rates</div></div>
        <div class="feature"><div class="feature-value">2000+</div><div class="feature-label">Crypto Assets</div></div>
        <div class="feature"><div class="feature-value">24 / 7</div><div class="feature-label">Availability</div></div>
      </div>
    </section>
  </main>

  <footer>© 2026 SwapFee.com — Powered by StealthEX</footer>

  <!-- Three.js for 3D Background -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    const canvas = document.getElementById("bg-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020408, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 50); // كاميرا ثابتة

    // إضاءة كرتونية قوية
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(10, 20, 30);
    scene.add(dirLight);

    const objects = [];
    const pointsArray = []; // لربط الخطوط

    // خامة الخطوط الخارجية السوداء (ستايل ريك اند مورتي)
    const outlineMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });

    // دالة إنشاء الكواكب الكرتونية
    function createToonPlanet(color, size, x, y, z) {
      const group = new THREE.Group();
      
      const geo = new THREE.DodecahedronGeometry(size, 1);
      const mat = new THREE.MeshToonMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);

      // إضافة الخط الأسود الخارجي
      const outline = new THREE.Mesh(geo, outlineMaterial);
      outline.scale.setScalar(1.08);
      group.add(outline);

      // تفاصيل حفر (Craters)
      const craterGeo = new THREE.CylinderGeometry(size*0.2, size*0.2, size*0.1, 8);
      const craterMat = new THREE.MeshToonMaterial({ color: 0x333333 });
      const crater = new THREE.Mesh(craterGeo, craterMat);
      crater.position.set(0, size*0.9, size*0.3);
      crater.rotation.x = Math.PI/2;
      group.add(crater);

      group.position.set(x, y, z);
      
      // معلومات الحركة
      group.userData = {
        baseX: x, baseY: y, baseZ: z,
        speedX: Math.random() * 0.02, speedY: Math.random() * 0.02,
        rotSpeedX: Math.random() * 0.01, rotSpeedY: Math.random() * 0.01
      };

      scene.add(group);
      objects.push(group);
      pointsArray.push(group.position);
      return group;
    }

    // دالة إنشاء عملات معدنية 3D سميكة
    function createToonCoin(color, size, x, y, z) {
      const group = new THREE.Group();
      
      const geo = new THREE.CylinderGeometry(size, size, size * 0.4, 32);
      const mat = new THREE.MeshToonMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = Math.PI / 2;
      group.add(mesh);

      const outline = new THREE.Mesh(geo, outlineMaterial);
      outline.scale.setScalar(1.08);
      outline.rotation.x = Math.PI / 2;
      group.add(outline);

      group.position.set(x, y, z);
      
      group.userData = {
        baseX: x, baseY: y, baseZ: z,
        speedX: Math.random() * 0.015, speedY: Math.random() * 0.015,
        rotSpeedX: Math.random() * 0.03, rotSpeedY: Math.random() * 0.03
      };

      scene.add(group);
      objects.push(group);
      pointsArray.push(group.position);
      return group;
    }

    // إضافة الكائنات للفضاء
    createToonPlanet(0xff0055, 4, -25, 15, -10);
    createToonPlanet(0x00ff88, 3, 28, 10, -5);
    createToonPlanet(0x8800ff, 5, -30, -15, -15);
    createToonPlanet(0x00ccff, 2.5, 30, -20, -10);
    createToonCoin(0xffaa00, 2.5, -15, 25, 0);
    createToonCoin(0xaaaaaa, 2, 18, 22, -5);
    createToonCoin(0x55ff55, 2.2, 15, -25, 5);

    // الخطوط المتصلة
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00eaff, transparent: true, opacity: 0.3 });
    const lineGeo = new THREE.BufferGeometry();
    const linesMesh = new THREE.LineSegments(lineGeo, lineMaterial);
    scene.add(linesMesh);

    // النبضات الضوئية (الكرات الصغيرة التي تسري في الخطوط)
    const lights = [];
    const lightGeo = new THREE.SphereGeometry(0.3, 8, 8);
    const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for(let i=0; i<3; i++) {
        const lightMesh = new THREE.Mesh(lightGeo, lightMat);
        scene.add(lightMesh);
        lights.push({ mesh: lightMesh, progress: Math.random(), startIndex: 0, endIndex: 1 });
    }

    // التفاعل مع الماوس
    let mouseX = 0; let mouseY = 0;
    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // تحريك المجسمات بشكل منفصل (طوفان)
      const positions = [];
      objects.forEach(obj => {
        // حركة الطفو
        obj.position.y = obj.userData.baseY + Math.sin(time * 2 + obj.userData.speedY * 100) * 2;
        obj.position.x = obj.userData.baseX + Math.cos(time * 2 + obj.userData.speedX * 100) * 2;
        
        // تفاعل المجسم مع الماوس (Parallax)
        obj.position.x += mouseX * 2;
        obj.position.y += mouseY * 2;

        // الدوران
        obj.rotation.x += obj.userData.rotSpeedX;
        obj.rotation.y += obj.userData.rotSpeedY;

        positions.push(obj.position.x, obj.position.y, obj.position.z);
      });

      // تحديث الخطوط لتربط بين المجسمات المتحركة
      const linePositions = [];
      for(let i=0; i<objects.length; i++) {
        for(let j=i+1; j<objects.length; j++) {
            // رسم خطوط لبعض المسافات القريبة
            const dist = objects[i].position.distanceTo(objects[j].position);
            if(dist < 50) {
                linePositions.push(
                    objects[i].position.x, objects[i].position.y, objects[i].position.z,
                    objects[j].position.x, objects[j].position.y, objects[j].position.z
                );
            }
        }
      }
      linesMesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

      // تحريك الضوء عبر الخطوط
      lights.forEach(light => {
          light.progress += 0.01;
          if(light.progress >= 1) {
              light.progress = 0;
              light.startIndex = Math.floor(Math.random() * objects.length);
              light.endIndex = Math.floor(Math.random() * objects.length);
          }
          const start = objects[light.startIndex].position;
          const end = objects[light.endIndex].position;
          light.mesh.position.lerpVectors(start, end, light.progress);
      });

      renderer.render(scene, camera);
    }
    
    // توافق مع تغير حجم الشاشة
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
