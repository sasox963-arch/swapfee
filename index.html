  <!-- =======================================================

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    (() => {

      "use strict";

      /* =====================================================
         BASIC THREE.JS SETUP
         ===================================================== */

      const canvas = document.getElementById("bg-canvas");

      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        powerPreference: "high-performance"
      });

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 1.6)
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setClearColor(0x000000, 0);

      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        52,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      camera.position.set(0, 0, 78);

      /* =====================================================
         LIGHTING
         ===================================================== */

      const ambient = new THREE.AmbientLight(0x18243d, 2.2);
      scene.add(ambient);

      const whiteLight = new THREE.DirectionalLight(0xffffff, 2.7);
      whiteLight.position.set(25, 35, 55);
      scene.add(whiteLight);

      const cyanLight = new THREE.PointLight(0x00eaff, 180, 170);
      cyanLight.position.set(38, 12, 25);
      scene.add(cyanLight);

      const purpleLight = new THREE.PointLight(0x8b4dff, 190, 190);
      purpleLight.position.set(-35, -20, 20);
      scene.add(purpleLight);

      const goldLight = new THREE.PointLight(0xffa62b, 150, 160);
      goldLight.position.set(35, -28, 15);
      scene.add(goldLight);

      /* =====================================================
         RANDOM HELPERS
         ===================================================== */

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function randomColor(colors) {
        return colors[Math.floor(Math.random() * colors.length)];
      }

      /* =====================================================
         PROCEDURAL PLANET TEXTURE
         ===================================================== */

      function createPlanetMaps(baseColor, patchColors) {

        const size = 512;

        const colorCanvas = document.createElement("canvas");
        colorCanvas.width = size;
        colorCanvas.height = size;

        const ctx = colorCanvas.getContext("2d");

        const gradient = ctx.createRadialGradient(
          150, 140, 20, 300, 300, 400
        );

        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(0.12, baseColor);
        gradient.addColorStop(1, "#03050c");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);

        for (let i = 0; i < 30; i++) {

          const color = randomColor(patchColors);
          ctx.fillStyle = color;
          ctx.globalAlpha = rand(0.45, 0.95);
          ctx.beginPath();

          const x = rand(-40, size + 40);
          const y = rand(-40, size + 40);

          const points = 7 + Math.floor(Math.random() * 6);

          for (let j = 0; j < points; j++) {

            const angle = (Math.PI * 2 * j) / points;
            const radius = rand(18, 70);

            const px = x + Math.cos(angle) * radius;
            const py = y + Math.sin(angle) * radius * rand(0.65, 1.25);

            if (j === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }

          ctx.closePath();
          ctx.fill();
        }

        ctx.globalAlpha = 0.22;

        for (let i = 0; i < 70; i++) {
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(
            Math.random() * size,
            Math.random() * size,
            rand(2, 9),
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        ctx.globalAlpha = 0.55;

        for (let i = 0; i < 25; i++) {

          const x = Math.random() * size;
          const y = Math.random() * size;
          const r = rand(4, 17);

          ctx.fillStyle = "rgba(0,0,0,0.35)";
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = "rgba(255,255,255,0.20)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(x - r * 0.15, y - r * 0.15, r * 0.9, Math.PI * 0.1, Math.PI * 1.5);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;

        const bumpCanvas = document.createElement("canvas");
        bumpCanvas.width = size;
        bumpCanvas.height = size;

        const bumpCtx = bumpCanvas.getContext("2d");

        bumpCtx.fillStyle = "#777";
        bumpCtx.fillRect(0, 0, size, size);

        bumpCtx.globalAlpha = 0.55;

        for (let i = 0; i < 500; i++) {

          const value = Math.floor(rand(60, 210));
          bumpCtx.fillStyle = `rgb(${value},${value},${value})`;
          bumpCtx.beginPath();
          bumpCtx.arc(
            Math.random() * size,
            Math.random() * size,
            rand(1, 7),
            0,
            Math.PI * 2
          );
          bumpCtx.fill();
        }

        bumpCtx.globalAlpha = 1;

        const colorTexture = new THREE.CanvasTexture(colorCanvas);
        colorTexture.colorSpace = THREE.SRGBColorSpace;
        colorTexture.wrapS = THREE.RepeatWrapping;
        colorTexture.wrapT = THREE.ClampToEdgeWrapping;

        const bumpTexture = new THREE.CanvasTexture(bumpCanvas);

        return { colorTexture, bumpTexture };
      }

      /* =====================================================
         PLANET CREATOR
         ===================================================== */

      const objects = [];

      function addPlanet({
        radius,
        position,
        baseColor,
        patches,
        ringColor = null,
        depth = 0,
        float = 1,
        speed = 0.25
      }) {

        const group = new THREE.Group();

        const maps = createPlanetMaps(baseColor, patches);

        const geometry = new THREE.SphereGeometry(radius, 64, 64);

        const material = new THREE.MeshStandardMaterial({
          map: maps.colorTexture,
          bumpMap: maps.bumpTexture,
          bumpScale: radius * 0.025,
          roughness: 0.76,
          metalness: 0.05
        });

        const planet = new THREE.Mesh(geometry, material);
        group.add(planet);

        const atmosphereGeometry =
          new THREE.SphereGeometry(radius * 1.08, 48, 48);

        const atmosphereMaterial = new THREE.MeshBasicMaterial({
          color: new THREE.Color(baseColor),
          transparent: true,
          opacity: 0.12,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending
        });

        group.add(new THREE.Mesh(atmosphereGeometry, atmosphereMaterial));

        const rimGeometry =
          new THREE.SphereGeometry(radius * 1.03, 48, 48);

        const rimMaterial = new THREE.MeshBasicMaterial({
          color: new THREE.Color(baseColor),
          transparent: true,
          opacity: 0.06,
          side: THREE.FrontSide,
          blending: THREE.AdditiveBlending
        });

        group.add(new THREE.Mesh(rimGeometry, rimMaterial));

        if (ringColor) {

          const ringGeometry = new THREE.TorusGeometry(
            radius * 1.48,
            radius * 0.075,
            18,
            128
          );

          const ringMaterial = new THREE.MeshStandardMaterial({
            color: ringColor,
            emissive: ringColor,
            emissiveIntensity: 0.65,
            roughness: 0.32,
            metalness: 0.35
          });

          const ring = new THREE.Mesh(ringGeometry, ringMaterial);
          ring.rotation.x = Math.PI * 0.38;
          ring.rotation.z = Math.PI * 0.08;
          group.add(ring);
        }

        group.position.set(position[0], position[1], position[2]);

        group.userData = {
          baseX: position[0],
          baseY: position[1],
          baseZ: position[2],
          phase: Math.random() * Math.PI * 2,
          floatAmplitude: float,
          floatSpeed: speed * rand(0.75, 1.25),
          driftSpeed: rand(0.08, 0.20),
          rotationX: rand(-0.0025, 0.0025),
          rotationY: rand(-0.0035, 0.0035),
          rotationZ: rand(-0.0018, 0.0018),
          parallax: rand(0.18, 0.55),
          depth
        };

        scene.add(group);
        objects.push(group);

        return group;
      }

      /* =====================================================
         COIN TEXTURE
         ===================================================== */

      function createCoinTexture(symbol, colorA, colorB) {

        const size = 512;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;

        const ctx = canvas.getContext("2d");

        const gradient = ctx.createRadialGradient(
          180, 140, 20, 260, 270, 300
        );

        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(0.08, colorA);
        gradient.addColorStop(0.5, colorB);
        gradient.addColorStop(1, "#080b13");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);

        ctx.strokeStyle = "rgba(255,255,255,0.85)";
        ctx.lineWidth = 11;
        ctx.beginPath();
        ctx.arc(256, 256, 225, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "rgba(0,0,0,0.45)";
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(256, 256, 197, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.lineWidth = 3;

        for (let i = 0; i < 24; i++) {
          const a = (Math.PI * 2 * i) / 24;
          const r1 = 207;
          const r2 = 218;
          ctx.beginPath();
          ctx.moveTo(256 + Math.cos(a) * r1, 256 + Math.sin(a) * r1);
          ctx.lineTo(256 + Math.cos(a) * r2, 256 + Math.sin(a) * r2);
          ctx.stroke();
        }

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.font = symbol.length > 2
          ? '900 88px Arial Black, sans-serif'
          : '900 150px Arial Black, sans-serif';

        ctx.fillStyle = "rgba(0,0,0,0.70)";
        ctx.fillText(symbol, 269, 272);

        const textGradient = ctx.createLinearGradient(180, 160, 320, 350);
        textGradient.addColorStop(0, "#ffffff");
        textGradient.addColorStop(0.45, "#bcecff");
        textGradient.addColorStop(1, "#5578ff");

        ctx.fillStyle = textGradient;
        ctx.fillText(symbol, 256, 256);

        ctx.strokeStyle = "rgba(255,255,255,0.45)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(210, 205, 145, Math.PI * 1.08, Math.PI * 1.72);
        ctx.stroke();

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;

        return texture;
      }

      /* =====================================================
         COIN CREATOR
         ===================================================== */

      function addCoin({
        radius,
        depth,
        position,
        symbol,
        colorA,
        colorB,
        edgeColor,
        float = 1,
        speed = 0.3
      }) {

        const group = new THREE.Group();

        const geometry = new THREE.CylinderGeometry(
          radius, radius, depth, 72, 4, false
        );

        const faceTexture = createCoinTexture(symbol, colorA, colorB);

        const sideMaterial = new THREE.MeshStandardMaterial({
          color: edgeColor,
          roughness: 0.24,
          metalness: 0.92
        });

        const faceMaterial = new THREE.MeshStandardMaterial({
          map: faceTexture,
          roughness: 0.23,
          metalness: 0.66,
          emissive: new THREE.Color(edgeColor),
          emissiveIntensity: 0.05
        });

        const coin = new THREE.Mesh(
          geometry,
          [sideMaterial, faceMaterial, faceMaterial]
        );

        coin.rotation.x = Math.PI / 2;
        group.add(coin);

        const ringGeometry = new THREE.TorusGeometry(
          radius * 1.015, radius * 0.045, 16, 96
        );

        const ringMaterial = new THREE.MeshStandardMaterial({
          color: edgeColor,
          emissive: edgeColor,
          emissiveIntensity: 1.15,
          roughness: 0.25,
          metalness: 0.85
        });

        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = Math.PI / 2;
        group.add(ring);

        const innerRingGeometry = new THREE.TorusGeometry(
          radius * 0.82, radius * 0.018, 10, 80
        );

        const innerRing = new THREE.Mesh(
          innerRingGeometry,
          new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.28,
            blending: THREE.AdditiveBlending
          })
        );

        innerRing.rotation.x = Math.PI / 2;
        group.add(innerRing);

        group.position.set(position[0], position[1], position[2]);

        group.userData = {
          baseX: position[0],
          baseY: position[1],
          baseZ: position[2],
          phase: Math.random() * Math.PI * 2,
          floatAmplitude: float,
          floatSpeed: speed * rand(0.75, 1.3),
          driftSpeed: rand(0.08, 0.22),
          rotationX: rand(-0.006, 0.006),
          rotationY: rand(-0.012, 0.012),
          rotationZ: rand(-0.004, 0.004),
          parallax: rand(0.28, 0.75)
        };

        scene.add(group);
        objects.push(group);

        return group;
      }

      /* =====================================================
         MAJOR PLANETS
         ===================================================== */

      const p1 = addPlanet({
        radius: 10.5,
        position: [-43, 25, -28],
        baseColor: "#214ed4",
        patches: ["#18b8d8", "#36df8c", "#723cff", "#0b78ba"],
        ringColor: 0x35d7ff,
        float: 0.65,
        speed: 0.18
      });

      const p2 = addPlanet({
        radius: 9.5,
        position: [43, 25, -34],
        baseColor: "#ff7b18",
        patches: ["#ffb62e", "#ff315f", "#8f39ff", "#5b24a9"],
        ringColor: 0xff37d4,
        float: 0.8,
        speed: 0.16
      });

      const p3 = addPlanet({
        radius: 8.5,
        position: [-45, -32, -24],
        baseColor: "#172e9d",
        patches: ["#00b7e8", "#27e6c5", "#684dff", "#144dca"],
        float: 0.8,
        speed: 0.22
      });

      const p4 = addPlanet({
        radius: 8.8,
        position: [46, -31, -26],
        baseColor: "#0b75bf",
        patches: ["#00d4ff", "#32d37c", "#2464ff", "#8cecff"],
        ringColor: 0x874cff,
        float: 0.7,
        speed: 0.20
      });

      const p5 = addPlanet({
        radius: 4.0,
        position: [-27, 9, -42],
        baseColor: "#8a1cff",
        patches: ["#ff42d0", "#4b3bff", "#15cfff"],
        float: 0.45,
        speed: 0.35
      });

      const p6 = addPlanet({
        radius: 3.7,
        position: [24, 34, -38],
        baseColor: "#0b76c9",
        patches: ["#5b43ff", "#18d6ff", "#9a4dff"],
        float: 0.5,
        speed: 0.31
      });

      /* =====================================================
         CRYPTO COINS
         ===================================================== */

      const c1 = addCoin({
        radius: 5.1,
        depth: 1.35,
        position: [44, 8, -12],
        symbol: "₿",
        colorA: "#ffd36a",
        colorB: "#c66c00",
        edgeColor: 0xffa91c,
        float: 0.55,
        speed: 0.24
      });

      const c2 = addCoin({
        radius: 4.0,
        depth: 1.05,
        position: [-41, -5, -10],
        symbol: "SOL",
        colorA: "#7cfff0",
        colorB: "#742dff",
        edgeColor: 0x6c42ff,
        float: 0.65,
        speed: 0.32
      });

      const c3 = addCoin({
        radius: 4.2,
        depth: 1.1,
        position: [39, -8, -15],
        symbol: "ETH",
        colorA: "#b4c9ff",
        colorB: "#263b98",
        edgeColor: 0x668cff,
        float: 0.7,
        speed: 0.28
      });

      const c4 = addCoin({
        radius: 3.4,
        depth: 0.9,
        position: [-17, -31, -17],
        symbol: "BNB",
        colorA: "#ffe78b",
        colorB: "#b77808",
        edgeColor: 0xffc62e,
        float: 0.65,
        speed: 0.35
      });

      const c5 = addCoin({
        radius: 3.0,
        depth: 0.85,
        position: [11, 29, -16],
        symbol: "₮",
        colorA: "#8dffdf",
        colorB: "#0c735b",
        edgeColor: 0x17d9a2,
        float: 0.5,
        speed: 0.37
      });

      /* =====================================================
         ASTEROIDS
         ===================================================== */

      function makeAsteroidMaterial() {

        const colors = [
          0x5a5060,
          0x3c4352,
          0x704f55,
          0x45515c,
          0x6b5964
        ];

        return new THREE.MeshStandardMaterial({
          color: randomColor(colors),
          roughness: 0.94,
          metalness: 0.05,
          flatShading: true
        });
      }

      const asteroidCount = window.innerWidth < 700 ? 12 : 24;

      for (let i = 0; i < asteroidCount; i++) {

        const radius = rand(0.45, 1.7);

        const geometry = new THREE.IcosahedronGeometry(radius, 1);

        const asteroid = new THREE.Mesh(
          geometry,
          makeAsteroidMaterial()
        );

        const x = rand(-62, 62);
        const y = rand(-47, 47);
        const z = rand(-65, -25);

        asteroid.position.set(x, y, z);

        asteroid.scale.set(
          rand(0.75, 1.3),
          rand(0.65, 1.25),
          rand(0.75, 1.3)
        );

        asteroid.userData = {
          baseX: x,
          baseY: y,
          baseZ: z,
          phase: Math.random() * Math.PI * 2,
          floatAmplitude: rand(0.15, 0.65),
          floatSpeed: rand(0.08, 0.25),
          rotationX: rand(-0.012, 0.012),
          rotationY: rand(-0.015, 0.015),
          rotationZ: rand(-0.010, 0.010),
          parallax: rand(0.08, 0.25)
        };

        scene.add(asteroid);
        objects.push(asteroid);
      }

      /* =====================================================
         STARS
         ===================================================== */

      function createStars(count, size, opacity) {

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          positions[i * 3] = rand(-130, 130);
          positions[i * 3 + 1] = rand(-100, 100);
          positions[i * 3 + 2] = rand(-130, -45);
        }

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3)
        );

        const material = new THREE.PointsMaterial({
          color: 0xbdeeff,
          size,
          transparent: true,
          opacity,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        return new THREE.Points(geometry, material);
      }

      scene.add(createStars(window.innerWidth < 700 ? 450 : 1000, 0.34, 0.78));
      scene.add(createStars(window.innerWidth < 700 ? 120 : 280, 0.72, 0.35));

      /* =====================================================
         NETWORK
         ===================================================== */

      const networkNodes = [p1, p2, p3, p4, p5, p6, c1, c2, c3, c4, c5];

      const edges = [
        [p1, p5], [p5, c2], [c2, p3],
        [p1, p6], [p6, p2],
        [p2, c1], [c1, c3], [c3, p4],
        [c2, c4], [c4, p3],
        [c5, p1], [c5, p2],
        [c4, c5], [c5, c3]
      ];

      const networkLines = [];

      function createNetworkLine(color, opacity) {

        const geometry = new THREE.BufferGeometry();

        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(new Float32Array(6), 3)
        );

        return new THREE.Line(
          geometry,
          new THREE.LineBasicMaterial({
            color,
            transparent: true,
            opacity,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          })
        );
      }

      edges.forEach(([a, b]) => {

        const glow = createNetworkLine(0x008cff, 0.10);
        const core = createNetworkLine(0x25dfff, 0.42);

        scene.add(glow);
        scene.add(core);

        networkLines.push({ a, b, glow, core });
      });

      /* =====================================================
         NETWORK NODES
         ===================================================== */

      const networkLights = [];

      function addNetworkLight(node) {

        const geometry = new THREE.SphereGeometry(0.42, 16, 16);

        const material = new THREE.MeshBasicMaterial({
          color: 0x00eaff,
          transparent: true,
          opacity: 0.88,
          blending: THREE.AdditiveBlending
        });

        const light = new THREE.Mesh(geometry, material);

        node.add(light);

        networkLights.push({
          mesh: light,
          phase: Math.random() * Math.PI * 2
        });
      }

      [p1, p2, p3, p4, c1, c2, c3, c4].forEach(addNetworkLight);

      /* =====================================================
         TRAVELING DATA PULSES
         ===================================================== */

      const pulses = [];

      function firePulse() {

        if (!networkLines.length) return;

        const connection = networkLines[
          Math.floor(Math.random() * networkLines.length)
        ];

        const reverse = Math.random() > 0.5;

        const start = reverse ? connection.b : connection.a;
        const end = reverse ? connection.a : connection.b;

        const geometry = new THREE.SphereGeometry(0.34, 16, 16);

        const material = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 1,
          blending: THREE.AdditiveBlending
        });

        const pulse = new THREE.Mesh(geometry, material);

        const halo = new THREE.Mesh(
          new THREE.SphereGeometry(0.85, 16, 16),
          new THREE.MeshBasicMaterial({
            color: 0x00eaff,
            transparent: true,
            opacity: 0.17,
            blending: THREE.AdditiveBlending
          })
        );

        pulse.add(halo);
        scene.add(pulse);

        pulses.push({
          mesh: pulse,
          start,
          end,
          progress: 0,
          speed: rand(0.004, 0.010)
        });
      }

      /* =====================================================
         MOUSE INTERACTION
         ===================================================== */

      let targetMouseX = 0;
      let targetMouseY = 0;

      let mouseX = 0;
      let mouseY = 0;

      window.addEventListener("mousemove", event => {
        targetMouseX = (event.clientX / window.innerWidth) * 2 - 1;
        targetMouseY = -((event.clientY / window.innerHeight) * 2 - 1);
      }, { passive: true });

      window.addEventListener("touchmove", event => {

        if (!event.touches.length) return;

        const touch = event.touches[0];

        targetMouseX = (touch.clientX / window.innerWidth) * 2 - 1;
        targetMouseY = -((touch.clientY / window.innerHeight) * 2 - 1);
      }, { passive: true });

      /* =====================================================
         RESIZE
         ===================================================== */

      window.addEventListener("resize", () => {

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio || 1, 1.6)
        );
      });

      /* =====================================================
         ANIMATION
         ===================================================== */

      const clock = new THREE.Clock();

      let pulseTimer = 0;

      function animate() {

        requestAnimationFrame(animate);

        const time = clock.getElapsedTime();

        mouseX += (targetMouseX - mouseX) * 0.035;
        mouseY += (targetMouseY - mouseY) * 0.035;

        objects.forEach(object => {

          const data = object.userData;

          object.rotation.x += data.rotationX || 0;
          object.rotation.y += data.rotationY || 0;
          object.rotation.z += data.rotationZ || 0;

          const wave = Math.sin(time * data.floatSpeed + data.phase);

          const wave2 = Math.cos(
            time * data.floatSpeed * 0.73 + data.phase * 1.31
          );

          const px = mouseX * (data.parallax || 0.2) * 5.5;
          const py = mouseY * (data.parallax || 0.2) * 4.2;

          object.position.x = data.baseX +
            wave2 * (data.floatAmplitude || 0.3) * 0.42 + px;

          object.position.y = data.baseY +
            wave * (data.floatAmplitude || 0.3) + py;

          object.position.z = data.baseZ +
            Math.sin(time * (data.floatSpeed || 0.2) * 0.42 + data.phase) * 0.35;
        });

        networkLines.forEach(connection => {

          const a = connection.a.position;
          const b = connection.b.position;

          const glowPositions = connection.glow.geometry.attributes.position.array;
          const corePositions = connection.core.geometry.attributes.position.array;

          glowPositions[0] = a.x;
          glowPositions[1] = a.y;
          glowPositions[2] = a.z;
          glowPositions[3] = b.x;
          glowPositions[4] = b.y;
          glowPositions[5] = b.z;

          corePositions[0] = a.x;
          corePositions[1] = a.y;
          corePositions[2] = a.z;
          corePositions[3] = b.x;
          corePositions[4] = b.y;
          corePositions[5] = b.z;

          connection.glow.geometry.attributes.position.needsUpdate = true;
          connection.core.geometry.attributes.position.needsUpdate = true;
        });

        networkLights.forEach(item => {

          const pulse = 0.65 + Math.sin(time * 2.2 + item.phase) * 0.35;

          item.mesh.scale.setScalar(pulse);
          item.mesh.material.opacity = 0.55 + pulse * 0.4;
        });

        for (let i = pulses.length - 1; i >= 0; i--) {

          const p = pulses[i];

          p.progress += p.speed;

          if (p.progress >= 1) {

            scene.remove(p.mesh);
            p.mesh.geometry.dispose();
            p.mesh.material.dispose();
            pulses.splice(i, 1);
            continue;
          }

          p.mesh.position.lerpVectors(
            p.start.position,
            p.end.position,
            p.progress
          );

          let opacity = 1;

          if (p.progress < 0.10) opacity = p.progress / 0.10;
          else if (p.progress > 0.90) opacity = (1 - p.progress) / 0.10;

          p.mesh.material.opacity = opacity;
        }

        pulseTimer += 0.016;

        if (pulseTimer > rand(0.8, 1.8)) {

          if (pulses.length < 7) firePulse();

          pulseTimer = 0;
        }

        renderer.render(scene, camera);
      }

      setTimeout(firePulse, 600);
      setTimeout(firePulse, 1400);
      setTimeout(firePulse, 2200);

      animate();

    })();
  </script>
